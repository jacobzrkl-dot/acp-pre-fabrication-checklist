<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">ACP pre-fabrication flow</title>
  <desc id="desc">Five steps: confirm panel, confirm drawings, trial fold, coordinate fixing, inspect first installation.</desc>
  <rect width="1200" height="420" fill="#f5f7f8"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2933">ACP pre-fabrication flow</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(45 125)"><rect width="190" height="150" rx="14" fill="#ffffff" stroke="#aab7c4" stroke-width="2"/><circle cx="95" cy="38" r="20" fill="#445e72"/><text x="95" y="45" font-size="18" fill="#fff">1</text><text x="95" y="87" font-size="18" font-weight="700" fill="#243746">Confirm panel</text><text x="95" y="113" font-size="14" fill="#516574">construction and finish</text></g>
    <g transform="translate(275 125)"><rect width="190" height="150" rx="14" fill="#ffffff" stroke="#aab7c4" stroke-width="2"/><circle cx="95" cy="38" r="20" fill="#445e72"/><text x="95" y="45" font-size="18" fill="#fff">2</text><text x="95" y="87" font-size="18" font-weight="700" fill="#243746">Confirm drawings</text><text x="95" y="113" font-size="14" fill="#516574">profile and fixing detail</text></g>
    <g transform="translate(505 125)"><rect width="190" height="150" rx="14" fill="#ffffff" stroke="#aab7c4" stroke-width="2"/><circle cx="95" cy="38" r="20" fill="#445e72"/><text x="95" y="45" font-size="18" fill="#fff">3</text><text x="95" y="87" font-size="18" font-weight="700" fill="#243746">Trial fold</text><text x="95" y="113" font-size="14" fill="#516574">approve tooling and finish</text></g>
    <g transform="translate(735 125)"><rect width="190" height="150" rx="14" fill="#ffffff" stroke="#aab7c4" stroke-width="2"/><circle cx="95" cy="38" r="20" fill="#445e72"/><text x="95" y="45" font-size="18" fill="#fff">4</text><text x="95" y="87" font-size="18" font-weight="700" fill="#243746">Coordinate fixing</text><text x="95" y="113" font-size="14" fill="#516574">rail, drainage, movement</text></g>
    <g transform="translate(965 125)"><rect width="190" height="150" rx="14" fill="#ffffff" stroke="#aab7c4" stroke-width="2"/><circle cx="95" cy="38" r="20" fill="#445e72"/><text x="95" y="45" font-size="18" fill="#fff">5</text><text x="95" y="87" font-size="18" font-weight="700" fill="#243746">Inspect first install</text><text x="95" y="113" font-size="14" fill="#516574">alignment and face quality</text></g>
  </g>
  <g stroke="#6e8798" stroke-width="4" fill="none"><path d="M235 200H275"/><path d="M465 200H505"/><path d="M695 200H735"/><path d="M925 200H965"/></g>
  <g fill="#6e8798"><path d="M270 193l12 7-12 7z"/><path d="M500 193l12 7-12 7z"/><path d="M730 193l12 7-12 7z"/><path d="M960 193l12 7-12 7z"/></g>
  <text x="600" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#516574">Use the approved panel-system documentation and project drawings at every step.</text>
</svg>
